name: CRM Source Audit Schedule

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Checkout production branch definition
        uses: actions/checkout@v4
        with:
          ref: crm-ui-dashboard

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=efps-crm-source-audit")
          token=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.value)' "$token_json")
          test -n "$token"
          printf 'token=%s
' "$token" >> "$GITHUB_OUTPUT"

      - name: Inspect OIDC claims
        env:
          CRM_SOURCE_AUDIT_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node - <<'NODE'
          const token=process.env.CRM_SOURCE_AUDIT_TOKEN;
          const payload=JSON.parse(Buffer.from(token.split('.')[1],'base64url').toString('utf8'));
          console.log(JSON.stringify({
            iss:payload.iss,
            aud:payload.aud,
            repository:payload.repository,
            ref:payload.ref,
            workflow_ref:payload.workflow_ref,
            repository_visibility:payload.repository_visibility,
            ref_type:payload.ref_type
          },null,2));
          NODE

      - name: Run read-only source audit
        env:
          CRM_SOURCE_AUDIT_TOKEN: ${{ steps.oidc.outputs.token }}
          CRM_SOURCE_AUDIT_URL: https://easyfind-crm-d01-d05.onrender.com/mcp
        run: node scripts/crm-source-audit-runner.mjs
