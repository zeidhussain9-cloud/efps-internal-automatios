name: Inventory Contract

on:
  push:
    paths:
      - "shared/google_sheets/**"
      - "shared/whatsapp_whapi/**"
      - "shared/google_maps/**"
      - "modules/efps-inventory-mgmnt/**"
      - "tools/**"
      - ".github/workflows/inventory-contract.yml"
  pull_request:
    paths:
      - "shared/google_sheets/**"
      - "shared/whatsapp_whapi/**"
      - "shared/google_maps/**"
      - "modules/efps-inventory-mgmnt/**"
      - "tools/**"
      - ".github/workflows/inventory-contract.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile inventory and shared Python modules
        run: python -m compileall -q shared modules/efps-inventory-mgmnt/src tools
      - name: Run repository line-count and contract audit
        run: python tools/repository_audit.py
      - name: Run inventory and deterministic regression suite
        env:
          PYTHONPATH: .:modules/efps-inventory-mgmnt
        run: |
          python -m pytest -q shared/google_sheets/test_schema.py modules/efps-inventory-mgmnt/tests modules/efps-inventory-mgmnt/src/test_inventory_pipeline.py tools/test_deterministic_edge_cases.py
          python tools/projection_regression_check.py
