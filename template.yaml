AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EFPS internal automation live integration

Parameters:
  LeadsTableArn:
    Type: String
  InteractionsTableArn:
    Type: String
  LeadAuditTableArn:
    Type: String
  LeadsStreamArn:
    Type: String
  SessionsTableArn:
    Type: String
    Description: ARN of the existing efps-sessions DynamoDB table used by Inventory Stage 1
  WebhookToken:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager ARN whose JSON {"token":"..."} field contains the inbound webhook query-token
  WhApiSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON token field contains the WhAPI token
  SlackSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON bot_token and signing_secret fields contain Slack credentials
  GoogleSheetsSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose SecretString is the Google service-account JSON document (now used only for optional Vertex/Gemini enrichment; the Sheets sync is retired)
  CloudinarySecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON cloud_name, api_key, and api_secret fields contain Cloudinary credentials
  NotionSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Optional Secrets Manager ARN whose JSON api_token and webhook_secret fields enable the Notion property intake Lambda
  CatalogueTriggerSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Optional Secrets Manager ARN whose SecretString is the shared HMAC secret for the /catalogue/run operator trigger
  OlaMapsSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Optional Secrets Manager ARN whose SecretString contains the Ola Maps (Krutrim) API key for background locality normalization

Conditions:
  HasNotionSecret: !Not [!Equals [!Ref NotionSecretArn, '']]
  HasOlaMapsSecret: !Not [!Equals [!Ref OlaMapsSecretArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 257
    Environment:
      Variables:
        EFPS_WEBHOOK_LIVE: '1'
        EFPS_WHAPI_LIVE: '1'
        EFPS_WEBHOOK_TOKEN: !Sub '{{resolve:secretsmanager:${WebhookToken}:SecretString:token}}'
        WHAPI_API_TOKEN: !Sub '{{resolve:secretsmanager:${WhApiSecretArn}:SecretString:token}}'
        SLACK_BOT_TOKEN: !Sub '{{resolve:secretsmanager:${SlackSecretArn}:SecretString:bot_token}}'
        SLACK_SIGNING_SECRET: !Sub '{{resolve:secretsmanager:${SlackSecretArn}:SecretString:signing_secret}}'
        GOOGLE_SERVICE_ACCOUNT_JSON: !Sub '{{resolve:secretsmanager:${GoogleSheetsSecretArn}:SecretString}}'
        CLOUDINARY_CLOUD_NAME: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:cloud_name}}'
        CLOUDINARY_API_KEY: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:api_key}}'
        CLOUDINARY_API_SECRET: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:api_secret}}'
        OLA_MAPS_API_KEY: !If [HasOlaMapsSecret, !Sub '{{resolve:secretsmanager:${OlaMapsSecretArn}:SecretString}}', !Ref 'AWS::NoValue']
        SLACK_LEADS_CHANNEL: 'C0BTM6PH55L'
        SLACK_INVENTORY_CHANNEL: 'C0BTQGG8VT3'
        SLACK_VERIFICATION_CHANNEL: 'C0BUHUHRK0Q'
        PYTHONPATH: 'modules/efpd-lead-mgmnt/src:modules/efps-inventory-mgmnt/src'
        LEAD_WORKER_ARN: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-EFPSLeadWorker-*'

Resources:
  EFPSNotionIntake:
    Type: AWS::Serverless::Function
    Condition: HasNotionSecret
    Properties:
      FunctionName: !Sub '${AWS::StackName}-EFPSNotionIntake'
      Timeout: 180
      MemorySize: 512
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
      Handler: notion_intake.lambda_handler
      CodeUri: .
      Environment:
        Variables:
          NOTION_API_TOKEN: !Sub '{{resolve:secretsmanager:${NotionSecretArn}:SecretString:api_token}}'
          NOTION_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${NotionSecretArn}:SecretString:webhook_secret}}'
          NOTION_SECRET_ARN: !Ref NotionSecretArn
          CATALOGUE_TRIGGER_SECRET_ARN: !Ref CatalogueTriggerSecretArn
          WHAPI_SECRET_ARN: !Ref WhApiSecretArn
          EFPS_WHAPI_LIVE: '0'
          EFPS_WHAPI_API_ENABLED: '0'
      Events:
        Intake:
          Type: Api
          Properties: { Path: /notion/intake, Method: post }
        CatalogueRun:
          Type: Api
          Properties: { Path: /catalogue/run, Method: post }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: [!Ref SessionsTableArn]
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-EFPSNotionIntake'

  EFPSInteractive:
    Type: AWS::Serverless::Function
    Properties:
      Handler: interactive_handler.lambda_handler
      CodeUri: .
      Events:
        Interactive:
          Type: Api
          Properties: { Path: /slack/interactive, Method: post }

  EFPSLeadWorker:
    Type: AWS::Serverless::Function
    Properties:
      Handler: leads_worker.lambda_handler
      CodeUri: .
      Events:
        LeadStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref LeadsStreamArn
            StartingPosition: LATEST
            BatchSize: 10
        DailyDigest:
          Type: Schedule
          Properties:
            Schedule: cron(30 3 ? * * *)
            Enabled: true
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
              Resource: [!Ref LeadsTableArn, !Ref InteractionsTableArn, !Ref LeadAuditTableArn]

Outputs:
  SlackInteractiveUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/interactive'
  NotionIntakeUrl:
    Condition: HasNotionSecret
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/notion/intake'