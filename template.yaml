AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EFPS internal automation live integration

Parameters:
  LeadsTableArn:
    Type: String
  InteractionsTableArn:
    Type: String
  LeadAuditTableArn:
    Type: String
  LeadsStreamArn:
    Type: String
  SessionsTableArn:
    Type: String
    Description: ARN of the existing efps-sessions DynamoDB table used by Inventory Stage 1
  WebhookToken:
    Type: String
    NoEcho: true
    Description: Existing inbound webhook query-token value for the deployed endpoint
  WhApiSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON api_token field contains the WhAPI token
  SlackSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON bot_token and signing_secret fields contain Slack credentials
  GoogleSheetsSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose SecretString is the Google service-account JSON document
  CloudinarySecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose JSON cloud_name, api_key, and api_secret fields contain Cloudinary credentials
  MapsSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
    Description: Existing Secrets Manager secret ARN whose SecretString contains the Google Maps API key

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 257
    Environment:
      Variables:
        EFPS_WEBHOOK_LIVE: '1'
        EFPS_WHAPI_LIVE: '1'
        EFPS_WEBHOOK_TOKEN: !Ref WebhookToken
        WHAPI_API_TOKEN: !Sub '{{resolve:secretsmanager:${WhApiSecretArn}:SecretString:token}}'
        SLACK_BOT_TOKEN: !Sub '{{resolve:secretsmanager:${SlackSecretArn}:SecretString:bot_token}}'
        SLACK_SIGNING_SECRET: !Sub '{{resolve:secretsmanager:${SlackSecretArn}:SecretString:signing_secret}}'
        GOOGLE_SERVICE_ACCOUNT_JSON: !Sub '{{resolve:secretsmanager:${GoogleSheetsSecretArn}:SecretString}}'
        CLOUDINARY_CLOUD_NAME: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:cloud_name}}'
        CLOUDINARY_API_KEY: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:api_key}}'
        CLOUDINARY_API_SECRET: !Sub '{{resolve:secretsmanager:${CloudinarySecretArn}:SecretString:api_secret}}'
        GOOGLE_MAPS_API_KEY: !Sub '{{resolve:secretsmanager:${MapsSecretArn}:SecretString}}'
        INVENTORY_SENDERS: '917975102130,919902024973'
        SLACK_LEADS_CHANNEL: 'C0BTM6PH55L'
        SLACK_INVENTORY_CHANNEL: 'C0BTQGG8VT3'
        SLACK_VERIFICATION_CHANNEL: 'C0BUHUHRK0Q'
        PYTHONPATH: 'modules/efpd-lead-mgmnt/src:modules/efps-inventory-mgmnt/src'

Resources:
  EFPSWebhook:
    Type: AWS::Serverless::Function
    Properties:
      Handler: webhook_handler.lambda_handler
      CodeUri: .
      Events:
        Webhook:
          Type: Api
          Properties: { Path: /whapi/webhook, Method: post }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan, dynamodb:DeleteItem]
              Resource: [!Ref LeadsTableArn, !Ref InteractionsTableArn, !Ref LeadAuditTableArn, !Ref SessionsTableArn]

  EFPSCommands:
    Type: AWS::Serverless::Function
    Properties:
      Handler: commands_handler.lambda_handler
      CodeUri: .
      Events:
        Command:
          Type: Api
          Properties: { Path: /slack/commands, Method: post }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
              Resource: [!Ref SessionsTableArn]

  EFPSEvents:
    Type: AWS::Serverless::Function
    Properties:
      Handler: events_handler.lambda_handler
      CodeUri: .
      Events:
        Events:
          Type: Api
          Properties: { Path: /slack/events, Method: post }
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
              Resource: [!Ref SessionsTableArn]
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-EFPSEvents-*"

  EFPSInteractive:
    Type: AWS::Serverless::Function
    Properties:
      Handler: interactive_handler.lambda_handler
      CodeUri: .
      Events:
        Interactive:
          Type: Api
          Properties: { Path: /slack/interactive, Method: post }

  EFPSBatch:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: .
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(30 2,6,12 ? * * *)
            Enabled: true

  EFPSLeadWorker:
    Type: AWS::Serverless::Function
    Properties:
      Handler: leads_worker.lambda_handler
      CodeUri: .
      Events:
        LeadStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref LeadsStreamArn
            StartingPosition: LATEST
            BatchSize: 10
        DailyDigest:
          Type: Schedule
          Properties:
            Schedule: cron(30 3 ? * * *)
            Enabled: true
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan]
              Resource: [!Ref LeadsTableArn, !Ref InteractionsTableArn, !Ref LeadAuditTableArn]

Outputs:
  WebhookUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/whapi/webhook'
  SlackCommandUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/commands'
  SlackEventsUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/events'
  SlackInteractiveUrl:
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/interactive'
