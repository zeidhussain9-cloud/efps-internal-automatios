AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated EFPS Notion property intake endpoint; does not modify the WhAPI/CRM stack.

Parameters:
  NotionSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  GoogleSheetsSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  CloudinarySecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'
  MapsSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'

Resources:
  NotionIntakeFailures:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 1080

  EFPSNotionIntake:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: efps-notion-intake
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: notion_intake.lambda_handler
      CodeUri: .
      Timeout: 180
      MemorySize: 512
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt NotionIntakeFailures.Arn
      Environment:
        Variables:
          NOTION_SECRET_ARN: !Ref NotionSecretArn
          GOOGLE_SHEETS_SECRET_ARN: !Ref GoogleSheetsSecretArn
          CLOUDINARY_SECRET_ARN: !Ref CloudinarySecretArn
          MAPS_SECRET_ARN: !Ref MapsSecretArn
          SUPABASE_URL: 'https://qttcutwzehtskfcwxkwj.supabase.co'
          SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0dGN1dHd6ZWh0c2tmY3d4a3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MzcxNzksImV4cCI6MjEwNjAxMzE3OX0.C1sk2ZQqLjfvZUlsscrWOEWnqGYOFl6-xEnLmLsojic'
          PYTHONPATH: 'modules/efpd-lead-mgmnt/src:modules/efps-inventory-mgmnt/src'
      Events:
        Reconcile:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Input: '{"_efps_notion_backfill": true}'
            Enabled: true
        Intake:
          Type: Api
          Properties:
            Path: /notion/intake
            Method: post
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:efps-notion-intake
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
              Resource: !Ref NotionSecretArn
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt NotionIntakeFailures.Arn
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource:
                - !Ref GoogleSheetsSecretArn
                - !Ref CloudinarySecretArn
                - !Ref MapsSecretArn

Outputs:
  NotionIntakeUrl:
    Description: Public HTTPS endpoint for the Notion connection webhook
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/notion/intake'
  NotionIntakeFunctionArn:
    Value: !GetAtt EFPSNotionIntake.Arn
